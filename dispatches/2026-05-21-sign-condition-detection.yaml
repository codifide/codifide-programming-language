title: "DecodeTheSign — Sign Condition Detection"

summary: >
  Gemini now assesses the physical state of every sign and returns sign_condition
  (clean/damaged/graffiti/obscured/faded). Damaged, graffiti, and obscured signs
  cannot overwrite feed rules. iOS shows a warning banner. No human review queue
  needed — handled automatically. tsc exits 0. iOS builds clean.

